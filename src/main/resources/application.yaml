server:
  port: 8090

spring:
  application:
    name: alensi-identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/alensi_identity}
    username: ${DB_USERNAME:alensi}
    password: ${DB_PASSWORD:alensi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/alensi}
          audiences: alensi-identity
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:alensi-identity}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:alensi-identity-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/alensi}/protocol/openid-connect/token

alensi:
  identity:
    keycloak:
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:alensi}
    # Usernames granted the alensi-identity "admin" role on all targets when first seen.
    bootstrap-admins: ${BOOTSTRAP_ADMINS:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
